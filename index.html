<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ADHDAI - An AI ad agency that generates the worst ads in the world. Algorithmically optimized for maximum awkwardness." />
    <meta name="theme-color" content="#F7F6F4" />
    
    <!-- Preconnect to Google Fonts for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload critical fonts -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" as="style" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" />
    
    <!-- Preconnect to OpenAI API for faster API calls -->
    <link rel="preconnect" href="https://api.openai.com" />
    
    <title>ADHDAI - We are the best at the worst</title>
    
    <!-- Critical CSS for initial render -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
        background: #F7F6F4;
        min-height: 100vh;
      }
      #root { min-height: 100vh; }
      
      /* Initial loading state */
      .initial-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #F7F6F4;
      }
      .initial-loader-text {
        font-family: 'Courier New', monospace;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #1a1a1a;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state before React hydrates -->
      <div class="initial-loader">
        <span class="initial-loader-text">ADHDAI</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
